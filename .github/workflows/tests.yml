name: Tests

on:
  push:
    branches: ['develop', 'staging', 'production']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, openssl

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: Rector
        run: vendor/bin/rector --dry-run --no-diffs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: vendor/bin/pest
